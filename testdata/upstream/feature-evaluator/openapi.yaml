openapi: 3.0.0
info:
  contact: {}
  description: Feature flag system with rule-based evaluation, segment targeting,
    pack-based feature bundling, and A/B experiments.
  title: Feature Evaluator API
  version: "1.0"
paths:
  /admin/api-keys:
    get:
      description: Returns all API keys (without secret hashes)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  taResponse-array_github_com_rendis_feature-evaluator_internal\
                  _domain_apikey_APIKey"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List API keys
      tags:
        - api-keys
    post:
      description: Generates a new API key and returns the plaintext secret (shown
        only once)
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                expiresAt:
                  type: string
                name:
                  type: string
                permissions:
                  items:
                    type: string
                  type: array
                type:
                  type: string
              type: object
        description: API key details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.AP\
                  IKeyCreatedResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Create an API key
      tags:
        - api-keys
  "/admin/api-keys/{id}":
    delete:
      description: Marks an API key as revoked so it can no longer be used
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  ssageResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Revoke an API key
      tags:
        - api-keys
  "/admin/api-keys/{id}/rotate":
    put:
      description: Replaces the secret of an existing API key; the old key is
        immediately invalid. Returns the new plaintext (shown only once)
      parameters:
        - description: API key ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.AP\
                  IKeyCreatedResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Rotate an API key
      tags:
        - api-keys
  /admin/audit/errors:
    get:
      description: Returns a paginated list of evaluation errors, optionally filtered
        by feature, tenant, error type, and date range
      parameters:
        - description: Filter by feature key
          in: query
          name: featureKey
          schema:
            type: string
        - description: Filter by tenant ID
          in: query
          name: tenantId
          schema:
            type: string
        - description: Filter by error type
          in: query
          name: errorType
          schema:
            type: string
        - description: Start date (RFC3339)
          in: query
          name: from
          schema:
            type: string
        - description: End date (RFC3339)
          in: query
          name: to
          schema:
            type: string
        - description: Page number (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Page size (default 20, max 100)
          in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Li\
                  stResponse-github_com_rendis_feature-evaluator_internal_dto_A\
                  uditErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List evaluation errors
      tags:
        - audit
  /admin/auth-profiles:
    get:
      description: Returns all auth profiles in the current workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  taResponse-array_github_com_rendis_feature-evaluator_internal\
                  _dto_AuthProfileResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List auth profiles
      tags:
        - auth-profiles
    post:
      description: Creates a new auth profile for incoming request authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Cr\
                eateAuthProfileRequest"
        description: Auth profile definition
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Au\
                  thProfileResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Create an auth profile
      tags:
        - auth-profiles
  "/admin/auth-profiles/{key}":
    delete:
      description: Removes an auth profile by key
      parameters:
        - description: Auth profile key
          in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  ssageResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Delete an auth profile
      tags:
        - auth-profiles
    get:
      description: Returns a single auth profile by key
      parameters:
        - description: Auth profile key
          in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Au\
                  thProfileResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Get an auth profile
      tags:
        - auth-profiles
    put:
      description: Updates an existing auth profile by key
      parameters:
        - description: Auth profile key
          in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Up\
                dateAuthProfileRequest"
        description: Updated auth profile definition
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Au\
                  thProfileResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Update an auth profile
      tags:
        - auth-profiles
  /admin/auth-profiles/test:
    post:
      description: Validates a draft auth profile against a simulated eval request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Te\
                stAuthProfileRequest"
        description: Draft auth profile and test request data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Au\
                  thProfileTestResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Test an auth profile
      tags:
        - auth-profiles
  /admin/changelog:
    get:
      description: Returns a paginated, filtered list of changelog entries
      parameters:
        - description: Filter by entity type
          in: query
          name: entityType
          schema:
            type: string
        - description: Filter by entity key
          in: query
          name: entityKey
          schema:
            type: string
        - description: Filter by actor
          in: query
          name: actor
          schema:
            type: string
        - description: Filter by action
          in: query
          name: action
          schema:
            type: string
        - description: Start date (RFC3339)
          in: query
          name: from
          schema:
            type: string
        - description: End date (RFC3339)
          in: query
          name: to
          schema:
            type: string
        - description: Page number (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Page size (default 20)
          in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Li\
                  stResponse-github_com_rendis_feature-evaluator_internal_dto_C\
                  hangeEntryResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List changelog entries
      tags:
        - changelog
  "/admin/changelog/{entityType}/{entityKey}":
    get:
      description: Returns changelog entries for a specific entity type and key
      parameters:
        - description: Entity type
          in: path
          name: entityType
          required: true
          schema:
            type: string
        - description: Entity key
          in: path
          name: entityKey
          required: true
          schema:
            type: string
        - description: Filter by actor
          in: query
          name: actor
          schema:
            type: string
        - description: Filter by action
          in: query
          name: action
          schema:
            type: string
        - description: Start date (RFC3339)
          in: query
          name: from
          schema:
            type: string
        - description: End date (RFC3339)
          in: query
          name: to
          schema:
            type: string
        - description: Page number (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Page size (default 20)
          in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Li\
                  stResponse-github_com_rendis_feature-evaluator_internal_dto_C\
                  hangeEntryResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List changelog entries for an entity
      tags:
        - changelog
  /admin/dashboard/activity:
    get:
      description: Returns the 10 most recently updated features for the activity feed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                    shboardActivityItem"
                type: array
      security:
        - BearerAuth: []
      summary: Dashboard activity
      tags:
        - dashboard
  /admin/dashboard/error-summary:
    get:
      description: Returns aggregated evaluation error counts for the dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  shboardErrorSummaryResponse"
      security:
        - BearerAuth: []
      summary: Dashboard error summary
      tags:
        - dashboard
  /admin/dashboard/metrics/cache:
    get:
      description: Returns cache hit/miss counts and hit ratio over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  tricsCacheResponse"
      security:
        - BearerAuth: []
      summary: Cache statistics
      tags:
        - metrics
  /admin/dashboard/metrics/environments:
    get:
      description: Returns evaluation counts broken down by environment over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  format: int64
                  type: integer
                type: object
      security:
        - BearerAuth: []
      summary: Environment breakdown
      tags:
        - metrics
  /admin/dashboard/metrics/external:
    get:
      description: Returns external call latency percentiles and circuit breaker event
        counts over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  tricsExternalResponse"
      security:
        - BearerAuth: []
      summary: External call statistics
      tags:
        - metrics
  /admin/dashboard/metrics/features:
    get:
      description: Returns the top features ranked by evaluation count over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
        - description: Max results to return (default 10)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                    tricsFeatureEntry"
                type: array
      security:
        - BearerAuth: []
      summary: Top features by evaluations
      tags:
        - metrics
  /admin/dashboard/metrics/overview:
    get:
      description: Returns today's evaluation totals and a multi-day trend
      parameters:
        - description: Number of days for the trend (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  tricsOverviewResponse"
      security:
        - BearerAuth: []
      summary: Metrics overview
      tags:
        - metrics
  /admin/dashboard/metrics/reasons:
    get:
      description: Returns evaluation reason counts aggregated over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  format: int64
                  type: integer
                type: object
      security:
        - BearerAuth: []
      summary: Evaluation reason breakdown
      tags:
        - metrics
  /admin/dashboard/metrics/tenants:
    get:
      description: Returns the top tenants ranked by evaluation count over the date range
      parameters:
        - description: Number of days (1-30, default 7)
          in: query
          name: days
          schema:
            type: integer
        - description: Max results to return (default 10)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                    tricsTenantEntry"
                type: array
      security:
        - BearerAuth: []
      summary: Top tenants by evaluations
      tags:
        - metrics
  /admin/dashboard/operations:
    get:
      description: Returns the current system status, dependency health, and runtime
        metrics snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  shboardOperationsResponse"
      security:
        - BearerAuth: []
      summary: Dashboard operations
      tags:
        - dashboard
  /admin/dashboard/stats:
    get:
      description: Returns aggregate counts of features, active features, segments,
        and segment members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  shboardStatsResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Dashboard stats
      tags:
        - dashboard
  /admin/environments:
    get:
      description: Returns the static list of valid environments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
      security:
        - BearerAuth: []
      summary: List environments
      tags:
        - features
  /admin/experiments:
    get:
      description: Returns all experiments in the current workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Da\
                  taResponse-array_github_com_rendis_feature-evaluator_internal\
                  _dto_ExperimentResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: List experiments
      tags:
        - experiments
    post:
      description: Creates a new A/B experiment for a feature
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Cr\
                eateExperimentRequest"
        description: Experiment creation payload
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Ex\
                  perimentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Create experiment
      tags:
        - experiments
  "/admin/experiments/{id}":
    get:
      description: Returns a single experiment by ID
      parameters:
        - description: Experiment ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Ex\
                  perimentResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Get experiment
      tags:
        - experiments
    put:
      description: Updates a draft experiment by ID
      parameters:
        - description: Experiment ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Up\
                dateExperimentRequest"
        description: Experiment update payload
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Ex\
                  perimentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Update experiment
      tags:
        - experiments
  "/admin/experiments/{id}/complete":
    post:
      description: Completes a running or paused experiment
      parameters:
        - description: Experiment ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Me\
                  ssageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_dto.Er\
                  rorResponse"
      security:
        - BearerAuth: []
      summary: Complete experiment
      tags:
        - experiments
  "/admin/experiments/{id}/declare-winner":
    post:
      description: Declares a winning variant for a completed experiment
      parameters:
        - description: Experiment ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
