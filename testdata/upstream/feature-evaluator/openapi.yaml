servers:
  - url: /features
components:
  securitySchemes:
    ApiKeyAuth:
      description: API key for evaluation or admin access
      in: header
      name: X-Api-Key
      type: apiKey
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT token
      in: header
      name: Authorization
      type: apiKey
    WorkspaceHeader:
      description: Workspace key for multi-tenant isolation
      in: header
      name: X-Workspace
      type: apiKey
  schemas:
    github_com_rendis_feature-evaluator_internal_domain_apikey.APIKey:
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        createdByPermissions:
          items:
            type: string
          type: array
        description:
          type: string
        expiresAt:
          type: string
        id:
          type: string
        lastUsedAt:
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
        prefix:
          type: string
        revoked:
          type: boolean
        type:
          $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_domain\
            _apikey.KeyType"
        workspaceKey:
          type: string
      type: object
    github_com_rendis_feature-evaluator_internal_domain_apikey.KeyType:
      enum:
        - admin
      type: string
      x-enum-varnames:
        - KeyTypeAdmin
    github_com_rendis_feature-evaluator_internal_domain_authprofile.Type:
      enum:
        - api_key
        - oidc_standard
        - custom
      type: string
      x-enum-varnames:
        - TypeAPIKey
        - TypeOIDCStandard
        - TypeCustom
    github_com_rendis_feature-evaluator_internal_domain_evaluation.AllRequest:
      properties:
        context:
          additionalProperties: {}
          type: object
        environment:
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    github_com_rendis_feature-evaluator_internal_domain_evaluation.AllResult:
      properties:
        environment:
          type: string
        evaluatedAt:
          type: string
        features:
          items:
            $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_domain\
              _evaluation.Result"
          type: array
        totalActive:
          type: integer
        totalEvaluated:
          type: integer
      type: object
    github_com_rendis_feature-evaluator_internal_domain_evaluation.BulkRequest:
      properties:
        features:
          items:
            $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_domain\
              _evaluation.Request"
          type: array
      type: object
    github_com_rendis_feature-evaluator_internal_domain_evaluation.BulkResult:
      properties:
        results:
          items:
            $ref: "#/components/schemas/github_com_rendis_feature-evaluator_internal_domain\
              _evaluation.Result"
          type: array
      type: object
    github_com_rendis_feature-evaluator_internal_domain_evaluation.EvalError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    github_com_rendis_feature-evaluator_internal_domain_evaluation.ExperimentInfo:
      properties:
        experimentId:
          type: string
